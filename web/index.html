<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RL3D</title>
  <link rel="stylesheet" href="lib/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 상단: 속보 티커 -->
  <div id="ticker" class="ticker">
    <span id="ticker-text">데이터를 불러오는 중…</span>
  </div>

  <!-- 툴바 -->
  <div id="toolbar" class="toolbar">
    <input id="search" class="search" type="text" placeholder="🔍 발사명 · 로켓 · 기관 검색  ( / )" />
    <div class="filters" id="filters">
      <label><input type="checkbox" class="flt" value="upcoming" checked /> <span class="dot d-upcoming"></span>예정</label>
      <label><input type="checkbox" class="flt" value="success" checked /> <span class="dot d-success"></span>성공</label>
      <label><input type="checkbox" class="flt" value="failure" checked /> <span class="dot d-failure"></span>실패</label>
      <label><input type="checkbox" class="flt" value="partial" checked /> <span class="dot d-partial"></span>부분</label>
      <span class="sep"></span>
      <label><input type="checkbox" id="toggle-terminator" checked /> 🌓 낮/밤</label>
      <label title="발사 밀도 히트맵 — 과거 아카이브를 불러올수록 뚜렷해집니다"><input type="checkbox" id="toggle-heat" /> 🔥 밀도</label>
      <label><input type="checkbox" id="toggle-sat" /> <span class="dot d-sat"></span>위성 <span id="sat-count" class="muted"></span></label>
      <button id="sat-groups-btn" class="btn sm" title="위성 그룹 선택">그룹 ▾</button>
    </div>
    <button id="basemap-btn" class="btn" title="배경 지도 전환 (다크 ↔ 위성사진)">🗺 다크</button>
    <button id="stats-btn" class="btn" title="발사 통계">📊 통계</button>
    <button id="toggle-list" class="btn" title="발사 목록 열기/닫기">☰ 목록</button>
    <button id="refresh" class="btn" title="캐시 무시 강제 갱신 (시간당 요청 제한 주의)">↻ 새로고침</button>
    <span id="freshness" class="freshness"></span>
  </div>

  <!-- 위성 그룹 선택 팝오버 -->
  <div id="sat-groups" class="sat-groups hidden"></div>

  <!-- 지도 -->
  <div id="map"></div>

  <!-- 발사 밀도 히트맵 범례 (P12-15) — 색이 무슨 뜻인지와 **무엇을 세고 있는지**(모수) -->
  <div id="heat-legend" class="heat-legend hidden"></div>

  <!-- 배경 타일을 못 받을 때(오프라인) 안내 배지 — 클릭하면 닫힌다 -->
  <button id="offline-badge" class="offline-badge hidden" title="눌러서 닫기"></button>

  <!-- 새 버전 안내 배지 (P12-12) — 본문을 누르면 릴리스 페이지, ✕ 는 그 버전만 닫는다 -->
  <div id="update-badge" class="update-badge hidden"></div>

  <!-- 발사 임박 집중 화면 (P12-3) — T-60분 안쪽 발사가 있을 때만 보인다 -->
  <div id="focus" class="focus hidden"></div>

  <!-- 발사 목록 사이드바 -->
  <aside id="sidebar" class="sidebar hidden">
    <div class="sb-tabs">
      <button id="tab-launches" class="sb-tab active">🚀 발사</button>
      <button id="tab-sats" class="sb-tab">🛰 위성</button>
      <button id="tab-favs" class="sb-tab" title="관심 발사·위성">⭐ 관심</button>
      <button id="tab-tonight" class="sb-tab" title="오늘 밤 눈으로 볼 만한 위성 통과">🌙 오늘 밤</button>
    </div>
    <input id="sat-search" class="sb-search hidden" type="text" placeholder="🔍 위성명 · NORAD" />
    <div class="sidebar-head"><span id="sidebar-count">0건</span></div>
    <div id="sidebar-list" class="sidebar-list"></div>
  </aside>

  <!-- 상세 패널 -->
  <aside id="panel" class="panel hidden">
    <button id="panel-close" class="panel-close">✕</button>
    <div id="panel-body"></div>
  </aside>

  <!-- 하단 타임라인 -->
  <div id="timeline" class="timeline">
    <span class="tl-cap">타임라인</span>
    <input id="tl-range" type="range" min="0" max="100" value="100" />
    <span id="tl-label" class="tl-label">전체 기간</span>
    <span class="sep"></span>
    <span class="tl-cap">과거</span>
    <select id="arch-year" class="arch-select" title="불러올 과거 연도"></select>
    <button id="arch-load" class="btn sm" title="선택 연도의 발사를 불러옴(최초 1회 API 요청)">불러오기</button>
  </div>

  <!-- 선택 위성 컨트롤 (지상궤적/추적/통과예측) -->
  <div id="sat-ctrl" class="sat-ctrl hidden">
    <span id="sat-ctrl-name" class="sat-ctrl-name"></span>
    <button id="sat-track-btn" class="btn sm" title="지도 중심을 위성에 고정">추적</button>
    <button id="sat-obs-btn" class="btn sm" title="지도를 클릭해 관측 위치 지정">📍 관측</button>
    <button id="sat-pass-btn" class="btn sm" title="관측지 기준 통과 예측" disabled>통과 예측</button>
    <span class="sat-ahead-wrap" title="궤적을 앞으로 늘려 보고, 그 시각 위치를 표시">
      <input id="sat-ahead" type="range" min="0" max="360" step="5" value="0" />
      <span id="sat-ahead-label" class="sat-ahead-label">지금</span>
    </span>
    <button id="sat-ctrl-close" class="sat-ctrl-close" title="선택 해제">✕</button>
  </div>

  <!-- 통과 예측 패널 -->
  <aside id="pass-panel" class="panel hidden">
    <button id="pass-close" class="panel-close">✕</button>
    <label class="pass-filter" title="관측자가 어둡고 위성이 햇빛을 받는 통과만">
      <input type="checkbox" id="toggle-visible-only" checked> 눈에 보이는 통과만
    </label>
    <div id="pass-body"></div>
  </aside>

  <!-- 발사 통계 패널 -->
  <aside id="stats-panel" class="panel hidden">
    <button id="stats-close" class="panel-close">✕</button>
    <div id="stats-body"></div>
  </aside>

  <!-- 단축키 도움말 (P12-14) — ? 로 열고 아무 키나 누르면 닫힘 -->
  <div id="keyhelp" class="keyhelp hidden"></div>

  <!-- 상태 표시 -->
  <div id="status" class="status hidden"></div>

  <script src="lib/maplibre-gl.js"></script>
  <script src="lib/satellite.min.js"></script>
  <!-- 클래식 스크립트라 최상위 let·function 이 파일 간에 공유된다 → 순서가 곧 의존 관계.
       state 는 가장 먼저, 실행 진입점인 boot 는 가장 마지막(P11-5). -->
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/map.js"></script>
  <script src="js/launches.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/sats.js"></script>
  <script src="js/trajectory.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/keys.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/update.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
