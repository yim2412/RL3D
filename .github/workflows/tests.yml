# 회귀 테스트 CI (P12-13).
#
# windows-latest 를 쓴다 — 이 앱은 Windows 데스크톱 exe 이고, startup.py 는 winreg 로
# WebView2 를 감지한다. 리눅스에서 도는 초록은 실제 배포 환경을 대변하지 못한다.
#
# 테스트는 네트워크가 필요 없다(픽스처·스텁 DOM 기반) → API 호출 없이 그대로 올라간다.
# 빌드는 `build` 잡이 따로 돈다(P50) — 처음엔 "필요가 생기면 그때"로 뺐는데, 2026-09-24 에
# build.bat 이 깨진 채 세 커밋·약 7시간 동안 CI 가 초록이었다. 그게 그 필요다.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # 러너 콘솔은 cp1252 다. 스크립트 쪽에서도 stdout 을 재설정하지만(2026-09-11 첫 CI 가
  # 실제로 여기서 깨졌다), 새로 붙는 스크립트가 그걸 빠뜨려도 CI 가 이유 없이 빨개지지
  # 않도록 부모가 자식의 stdio 인코딩을 정해 둔다(전역 규칙 3번).
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 파싱 회귀 테스트 (픽스처 기반)
        run: python tests/test_parsing.py

      - name: 캐시·폴백·아카이브·설정 회귀 테스트 (HTTP 주입)
        run: python tests/test_cache.py

      - name: 프론트 회귀 테스트 (스텁 DOM)
        run: node tests/test_frontend.js

      - name: 문서 회귀 테스트 (문서 ↔ 코드 대조)
        run: node tests/test_docs.js

      - name: 레이아웃 회귀 테스트 (헤드리스 Edge 기하)
        # 스텁 DOM 에는 좌표가 없어, "버튼이 다른 오버레이에 가려 클릭을 못 받는다"는
        # 부류가 688건 초록 뒤에 숨어 있었다(P34). 실제 Chromium 에 띄워 재는 유일한 자리다.
        # windows-latest 러너에는 Edge 가 깔려 있다 — 없으면 스크립트가 스스로 건너뛴다.
        run: node tests/test_layout.js

      - name: 정적 스캔 (전면 감사 2026-09-24)
        # 이 앱에서 반복된 실수(인코딩 미지정·재대입 전역 이름 import·URL 흩뿌림·변이 흔적·
        # top: 92px·이스케이프 없는 innerHTML 증가·bat 인코딩·BOM)를 잰다. selftest 가 먼저 —
        # 검사 하나가 조용히 죽으면(0건 초록) 스캔 결과를 믿을 수 없다.
        run: |
          python tools/audit_scan.py --selftest
          python tools/audit_scan.py

      - name: 감사 대장 규약 (docs/audit)
        # 재현 없는 높음·사라진 앵커·COVERAGE 누락을 기계로 막는다. selftest 먼저.
        run: |
          python docs/audit/check_findings.py --selftest
          python docs/audit/check_findings.py

      - name: 로그 스모크 (네트워크 불필요)
        # api_client.py 스모크는 네트워크를 쓰므로 CI 에서 돌리지 않는다.
        # startup.py 스모크도 넣지 않는다 — GitHub 러너에는 WebView2 런타임이 없어
        # [FAIL] 로 끝난다. 그건 앱의 실패가 아니라 러너의 사실이고, 감지 로직 자체는
        # 레지스트리 리더를 주입하는 테스트가 이미 덮는다.
        run: python applog.py

  build:
    # exe 가 **만들어지는지**와 **무엇이 들어갔는지**를 잰다(P50). 뜨는지는 못 잰다 —
    # 러너에 WebView2 가 없다(로컬 exe 스모크의 몫). 테스트 잡과 따로 두어 한쪽이
    # 빨개도 다른 쪽 결과가 가려지지 않게 한다.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # 릴리스 exe 를 만드는 로컬 venv 와 같은 부 버전
          cache: pip

      - name: exe 빌드 (build.bat)
        shell: cmd
        run: build.bat

      - name: 번들 대조 (web 전부 + 라이선스 전문)
        run: .venv\Scripts\python.exe tools\check_exe.py dist\RL3D.exe
