# 회귀 테스트 CI (P12-13).
#
# windows-latest 를 쓴다 — 이 앱은 Windows 데스크톱 exe 이고, startup.py 는 winreg 로
# WebView2 를 감지한다. 리눅스에서 도는 초록은 실제 배포 환경을 대변하지 못한다.
#
# 두 테스트 모두 네트워크가 필요 없다(픽스처·스텁 DOM 기반) → exe 빌드나 API 호출 없이
# 그대로 올라간다. 빌드(build.bat)는 CI 에 넣지 않았다 — 필요가 생기면 그때.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # 러너 콘솔은 cp1252 다. 스크립트 쪽에서도 stdout 을 재설정하지만(2026-09-11 첫 CI 가
  # 실제로 여기서 깨졌다), 새로 붙는 스크립트가 그걸 빠뜨려도 CI 가 이유 없이 빨개지지
  # 않도록 부모가 자식의 stdio 인코딩을 정해 둔다(전역 규칙 3번).
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 파싱 회귀 테스트 (픽스처 기반)
        run: python tests/test_parsing.py

      - name: 캐시·폴백·아카이브·설정 회귀 테스트 (HTTP 주입)
        run: python tests/test_cache.py

      - name: 프론트 회귀 테스트 (스텁 DOM)
        run: node tests/test_frontend.js

      - name: 로그 스모크 (네트워크 불필요)
        # api_client.py 스모크는 네트워크를 쓰므로 CI 에서 돌리지 않는다.
        # startup.py 스모크도 넣지 않는다 — GitHub 러너에는 WebView2 런타임이 없어
        # [FAIL] 로 끝난다. 그건 앱의 실패가 아니라 러너의 사실이고, 감지 로직 자체는
        # 레지스트리 리더를 주입하는 테스트가 이미 덮는다.
        run: python applog.py
